<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Drift Ghost - Carreras sobre hielo</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:#0e1420; color:#e8eef9; font-family:system-ui,Segoe UI,Arial,sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:10px; user-select:none; }
  h1 { margin:4px 0 2px; font-size:20px; }
  .sub { color:#8fa0bf; font-size:13px; margin-bottom:8px; text-align:center; }
  canvas { width:100%; max-width:1000px; aspect-ratio:1000/640; border-radius:12px; border:2px solid #25314a; background:#cfe0ee; touch-action:none; }
  .bar { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
  .bar button { background:#1b2740; color:#e8eef9; border:1px solid #2d3d5f; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .bar button:hover { background:#25355a; }
  #touch { display:none; width:100%; max-width:1000px; margin-top:10px; justify-content:space-between; gap:8px; }
  #touch .grp { display:flex; gap:8px; }
  #touch button { width:76px; height:64px; font-size:22px; border-radius:12px; border:1px solid #2d3d5f; background:#1b2740; color:#fff; }
  #touch button:active { background:#3b5aa0; }
  @media (pointer:coarse) { #touch { display:flex; } }
  .keys { color:#8fa0bf; font-size:12px; margin-top:8px; text-align:center; line-height:1.6; }
  kbd { background:#1b2740; border:1px solid #2d3d5f; border-radius:4px; padding:1px 6px; }
</style>
</head>
<body>
<h1>Drift Ghost</h1>
<div class="sub">Suelo de hielo: el coche derrapa. Tras tu primera ronda, aparece un fantasma con tu mejor tiempo.</div>
<canvas id="c" width="1000" height="640"></canvas>

<div id="touch">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
  <div class="grp"><button data-k="hand">&#9888;</button><button data-k="down">&#9660;</button><button data-k="up">&#9650;</button></div>
</div>

<div class="bar">
  <button id="btnStart">Empezar / Siguiente ronda (Espacio)</button>
  <button id="btnRestart">Reiniciar ronda (R)</button>
  <button id="btnClear">Borrar r&eacute;cord y fantasma</button>
</div>
<div class="keys"><kbd>&uarr;</kbd>/<kbd>W</kbd> acelerar &middot; <kbd>&darr;</kbd>/<kbd>S</kbd> frenar/marcha atr&aacute;s &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd>/<kbd>A</kbd><kbd>D</kbd> girar &middot; <kbd>Shift</kbd> freno de mano (derrape extra)</div>

<script>
// ====== Ajustes de fisica (toca estos numeros para cambiar la sensacion) ======
const ACC = 270;        // aceleracion del motor
const DRAG = 0.8;       // resistencia longitudinal (define la velocidad maxima)
const BRAKE = 420;      // frenada
const GRIP = 2.0;       // agarre lateral: MAS BAJO = MAS RESBALADIZO
const GRIP_HAND = 0.45; // agarre con freno de mano
const TURN = 2.5;       // giro (rad/s)
const OFF_DRAG = 2.2;   // frenado al salirte a la nieve
const TW = 72;          // anchura de la pista
const DT = 1/60;        // paso fijo de simulacion (importante para el fantasma)

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

// ====== Pista: spline cerrada Catmull-Rom ======
const ctrl = [[420,80],[700,100],[880,170],[900,290],[780,350],[640,330],[560,400],[620,490],[800,520],[780,590],[560,580],[380,540],[300,430],[330,330],[220,300],[110,360],[90,250],[150,130]];
const pts = [];
(function build() {
  const n = ctrl.length, S = 24;
  for (let i = 0; i < n; i++) {
    const p0 = ctrl[(i-1+n)%n], p1 = ctrl[i], p2 = ctrl[(i+1)%n], p3 = ctrl[(i+2)%n];
    for (let s = 0; s < S; s++) {
      const t = s/S, t2 = t*t, t3 = t2*t;
      pts.push([
        0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }
  }
})();
const N = pts.length;

function segDist(px, py, i) {
  const a = pts[(i+N)%N], b = pts[(i+1+N)%N];
  const abx = b[0]-a[0], aby = b[1]-a[1];
  let t = ((px-a[0])*abx + (py-a[1])*aby) / (abx*abx + aby*aby);
  t = Math.max(0, Math.min(1, t));
  const cx = a[0]+abx*t, cy = a[1]+aby*t;
  return { d: Math.hypot(px-cx, py-cy), cx, cy };
}

// capa de pista pre-renderizada
const trackCv = document.createElement("canvas"); trackCv.width = W; trackCv.height = H;
(function drawTrack() {
  const g = trackCv.getContext("2d");
  g.fillStyle = "#d3e3f1"; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 260; i++) {           // motas de nieve
    g.fillStyle = "rgba(255,255,255,.55)";
    g.beginPath(); g.arc(Math.random()*W, Math.random()*H, 1+Math.random()*3, 0, 6.3); g.fill();
  }
  const path = () => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); };
  g.lineJoin = "round"; g.lineCap = "butt";
  path(); g.lineWidth = TW + 18; g.strokeStyle = "#ffffff"; g.stroke();
  path(); g.lineWidth = TW + 18; g.strokeStyle = "#d9363e"; g.setLineDash([18, 18]); g.stroke(); g.setLineDash([]);
  path(); g.lineWidth = TW; g.strokeStyle = "#47566f"; g.stroke();
  path(); g.lineWidth = 2; g.strokeStyle = "rgba(255,255,255,.35)"; g.setLineDash([14, 16]); g.stroke(); g.setLineDash([]);
  // linea de salida / meta
  const a = pts[0], b = pts[1], ang = Math.atan2(b[1]-a[1], b[0]-a[0]);
  g.save(); g.translate(a[0], a[1]); g.rotate(ang);
  const sq = 9, cols = TW / sq;
  for (let r = 0; r < 2; r++) for (let c = 0; c < cols; c++) {
    g.fillStyle = (r + c) % 2 ? "#111" : "#fff";
    g.fillRect(-sq + r*sq, -TW/2 + c*sq, sq, sq);
  }
  g.restore();
})();
const skidCv = document.createElement("canvas"); skidCv.width = W; skidCv.height = H;
const skid = skidCv.getContext("2d");

// ====== Estado ======
let car, prog, lastIdx, frames, rec, state, countdown, round = 0, lastTime = null, msg = "";
let best = null; // { t, rec:[x,y,a,...] }
const keys = { up:false, down:false, left:false, right:false, hand:false };
let prevL = null, prevR = null;

try { const s = localStorage.getItem("drift_ghost_v1"); if (s) best = JSON.parse(s); } catch (e) {}
function saveBest() { try { localStorage.setItem("drift_ghost_v1", JSON.stringify(best)); } catch (e) {} }

function resetRound() {
  const a = pts[0], b = pts[1];
  car = { x:a[0], y:a[1], a:Math.atan2(b[1]-a[1], b[0]-a[0]), vx:0, vy:0 };
  prog = 0; lastIdx = 0; frames = 0; rec = [];
  skid.clearRect(0, 0, W, H); prevL = prevR = null;
  state = "ready"; msg = "";
}
function startRound() {
  if (state === "countdown" || state === "racing") return;
  resetRound(); round++; state = "countdown"; countdown = 3;
}
function restartRound() { if (state === "ready") return; round = Math.max(0, round - 1); resetRound(); startRound(); }

// ====== Fisica ======
function update() {
  if (state === "countdown") { countdown -= DT; if (countdown <= 0) state = "racing"; return; }
  if (state !== "racing") return;

  const st = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const c = car;
  let sp = Math.hypot(c.vx, c.vy);
  let fx = Math.cos(c.a), fy = Math.sin(c.a);
  let vf = c.vx*fx + c.vy*fy;
  c.a += st * TURN * Math.min(sp/110, 1) * (vf >= 0 ? 1 : -1) * DT;    // girar
  fx = Math.cos(c.a); fy = Math.sin(c.a);
  vf = c.vx*fx + c.vy*fy;                       // descomponer en la nueva orientacion
  let vl = -c.vx*fy + c.vy*fx;                  // velocidad lateral = derrape

  if (keys.up) vf += ACC * DT;
  if (keys.down) vf -= (vf > 5 ? BRAKE : 140) * DT;
  vf = Math.max(vf, -110);
  vf *= Math.exp(-DRAG * DT);
  vl *= Math.exp(-(keys.hand ? GRIP_HAND : GRIP) * DT);

  // posicion respecto a la pista
  let best_i = lastIdx, bd = 1e9, bc = null;
  for (let k = -30; k <= 30; k++) {
    const r = segDist(c.x, c.y, lastIdx + k);
    if (r.d < bd) { bd = r.d; best_i = (lastIdx + k + N) % N; bc = r; }
  }
  let delta = best_i - lastIdx; if (delta > N/2) delta -= N; if (delta < -N/2) delta += N;
  prog += delta; lastIdx = best_i;

  if (bd > TW/2 + 8) { const f = Math.exp(-OFF_DRAG * DT); vf *= f; vl *= f; }   // nieve fuera de pista

  c.vx = fx*vf - fy*vl; c.vy = fy*vf + fx*vl;
  c.x += c.vx * DT; c.y += c.vy * DT;

  // barrera blanda
  const lim = TW/2 + 45;
  const r2 = segDist(c.x, c.y, lastIdx);
  if (r2.d > lim) {
    const nx = (c.x - r2.cx) / r2.d, ny = (c.y - r2.cy) / r2.d;
    c.x = r2.cx + nx*lim; c.y = r2.cy + ny*lim;
    const vn = c.vx*nx + c.vy*ny;
    if (vn > 0) { c.vx -= 1.4*vn*nx; c.vy -= 1.4*vn*ny; }
  }

  // marcas de derrape
  if (Math.abs(vl) > 45 && bd < TW/2 + 8) {
    const rx = -Math.sin(c.a), ry = Math.cos(c.a), bx = c.x - Math.cos(c.a)*11, by = c.y - Math.sin(c.a)*11;
    const L = [bx + rx*6, by + ry*6], R = [bx - rx*6, by - ry*6];
    skid.strokeStyle = "rgba(15,20,30,.4)"; skid.lineWidth = 3; skid.lineCap = "round";
    if (prevL) { skid.beginPath(); skid.moveTo(prevL[0], prevL[1]); skid.lineTo(L[0], L[1]); skid.stroke();
                 skid.beginPath(); skid.moveTo(prevR[0], prevR[1]); skid.lineTo(R[0], R[1]); skid.stroke(); }
    prevL = L; prevR = R;
  } else { prevL = prevR = null; }

  frames++;
  rec.push(Math.round(c.x*10)/10, Math.round(c.y*10)/10, Math.round(c.a*1000)/1000);

  if (prog >= N) finish();
}

function finish() {
  state = "finished";
  const t = frames * DT;
  lastTime = t;
  if (!best || t < best.t) {
    const old = best ? best.t : null;
    best = { t, rec: rec.slice() }; saveBest();
    msg = old === null ? "Primera ronda completada. Ya tienes fantasma." : "NUEVO R\u00c9CORD  (-" + (old - t).toFixed(2) + " s)";
  } else {
    msg = "A +" + (t - best.t).toFixed(2) + " s del fantasma";
  }
}

// ====== Dibujo ======
function drawCar(x, y, a, body, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(-14, -7, 30, 18);
  ctx.fillStyle = body; ctx.fillRect(-15, -8, 30, 16);
  ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fillRect(2, -6, 8, 12);
  ctx.fillStyle = "#ffe36b"; ctx.fillRect(13, -7, 2, 4); ctx.fillRect(13, 3, 2, 4);
  ctx.restore();
}
function fmt(t) { return t === null ? "--.--" : t.toFixed(2) + " s"; }

function draw() {
  ctx.drawImage(trackCv, 0, 0);
  ctx.drawImage(skidCv, 0, 0);

  if (best) {                                   // fantasma
    const total = best.rec.length / 3;
    const f = Math.min(frames, total - 1) * 3;
    const gx = best.rec[f], gy = best.rec[f+1], ga = best.rec[f+2];
    drawCar(gx, gy, ga, "#27d3ff", 0.5);
    ctx.fillStyle = "rgba(10,60,90,.85)"; ctx.font = "bold 12px system-ui"; ctx.textAlign = "center";
    ctx.fillText("FANTASMA " + best.t.toFixed(2), gx, gy - 18);
  }
  drawCar(car.x, car.y, car.a, "#ff4b4b", 1);

  // HUD
  ctx.fillStyle = "rgba(14,20,32,.78)"; ctx.fillRect(10, 10, 250, 96);
  ctx.fillStyle = "#e8eef9"; ctx.textAlign = "left"; ctx.font = "bold 15px system-ui";
  ctx.fillText("Ronda " + Math.max(round, 1) + (best ? "  \u00b7  con fantasma" : "  \u00b7  sin fantasma"), 20, 32);
  ctx.font = "15px system-ui";
  ctx.fillText("Tiempo:  " + fmt(state === "ready" ? null : frames * DT), 20, 54);
  ctx.fillText("Mejor:   " + fmt(best ? best.t : null), 20, 74);
  ctx.fillText("\u00daltima:  " + fmt(lastTime), 20, 94);

  ctx.textAlign = "center";
  const big = (t, s) => { ctx.fillStyle = "rgba(14,20,32,.8)"; ctx.fillRect(W/2-250, H/2-60, 500, 120);
    ctx.fillStyle = "#fff"; ctx.font = "bold 34px system-ui"; ctx.fillText(t, W/2, H/2-4);
    ctx.font = "16px system-ui"; ctx.fillStyle = "#b9c7e3"; ctx.fillText(s, W/2, H/2+30); };
  if (state === "ready") big("Pulsa ESPACIO", round === 0 ? "para empezar la primera ronda" : "para la siguiente ronda");
  if (state === "countdown") { ctx.fillStyle = "#fff"; ctx.font = "bold 90px system-ui"; ctx.strokeStyle = "#0e1420"; ctx.lineWidth = 6;
    const n = Math.ceil(countdown); ctx.strokeText(n, W/2, H/2+30); ctx.fillText(n, W/2, H/2+30); }
  if (state === "finished") big(fmt(lastTime), msg + "  \u00b7  ESPACIO = siguiente ronda");
}

// ====== Bucle ======
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min((now - last) / 1000, 0.1); last = now;
  while (acc >= DT) { update(); acc -= DT; }
  draw();
  requestAnimationFrame(loop);
}

// ====== Controles ======
const map = { ArrowUp:"up", w:"up", W:"up", ArrowDown:"down", s:"down", S:"down", ArrowLeft:"left", a:"left", A:"left", ArrowRight:"right", d:"right", D:"right", Shift:"hand" };
addEventListener("keydown", e => {
  if (map[e.key]) { keys[map[e.key]] = true; e.preventDefault(); }
  if (e.code === "Space") { e.preventDefault(); if (state === "ready" || state === "finished") startRound(); }
  if (e.key === "r" || e.key === "R") restartRound();
});
addEventListener("keyup", e => { if (map[e.key]) keys[map[e.key]] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll("#touch button").forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; }, off = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off);
  b.addEventListener("pointerleave", off); b.addEventListener("pointercancel", off);
});
cv.addEventListener("pointerdown", () => { if (state === "ready" || state === "finished") startRound(); });
document.getElementById("btnStart").onclick = () => { if (state === "ready" || state === "finished") startRound(); };
document.getElementById("btnRestart").onclick = restartRound;
document.getElementById("btnClear").onclick = () => {
  best = null; lastTime = null; round = 0;
  try { localStorage.removeItem("drift_ghost_v1"); } catch (e) {}
  resetRound();
};

resetRound();
requestAnimationFrame(loop);
</script>
</body>
</html>
